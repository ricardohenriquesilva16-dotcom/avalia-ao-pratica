<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neymar Jr - Fan Page</title>
  <style>
    :root {
      --bg-color: #f4f4f9;
      --text-color: #1a1a1a;
      --card-bg: #ffffff;
      --accent-color: #009c3b;
      --button-bg: #ffdf00;
      --button-text: #000000;
      --border-color: #dddddd;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --text-color: #f4f4f9;
      --card-bg: #1e1e1e;
      --accent-color: #00ff55;
      --button-bg: #333333;
      --button-text: #ffffff;
      --border-color: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s, color 0.3s;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 2px solid var(--accent-color);
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      color: var(--accent-color);
    }

    .theme-toggle {
      background-color: var(--button-bg);
      color: var(--button-text);
      border: none;
      padding: 10px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 800px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 30px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      border: 1px solid var(--border-color);
    }

    .card img {
      width: 100%;
      height: 400px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .card-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .like-btn {
      background-color: var(--accent-color);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .like-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>
    <h1>Neymar Jr</h1>
    <button class="theme-toggle" id="themeBtn">Modo Escuro</button>
  </header>

  <div class="container">
    <div class="card">
      <img src="https://images.unsplash.com/photo-1518091043644-c1d4457512c6?auto=format&fit=crop&w=800&q=80" alt="Futebol">
      <div class="card-content">
        <h3>A Magia em Campo</h3>
        <button class="like-btn" onclick="addLike('count1')">
          ❤️ Curtir (<span id="count1">0</span>)
        </button>
      </div>
    </div>

    <div class="card">
      <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=800&q=80" alt="Estádio de Futebol">
      <div class="card-content">
        <h3>Habilidade e Dribles</h3>
        <button class="like-btn" onclick="addLike('count2')">
          ❤️ Curtir (<span id="count2">0</span>)
        </button>
      </div>
    </div>
  </div>

  <script>
    const themeBtn = document.getElementById('themeBtn');
    
    themeBtn.addEventListener('click', () => {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
        themeBtn.textContent = 'Modo Escuro';
      } else {
        document.body.setAttribute('data-theme', 'dark');
        themeBtn.textContent = 'Modo Claro';
      }
    });

    function addLike(elementId) {
      const countElement = document.getElementById(elementId);
      let currentLikes = parseInt(countElement.textContent);
      countElement.textContent = currentLikes + 1;
    }
  </script>

</body>
</html>
